<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #323441; --card: rgba(38, 40, 51, 0.85); --border: rgba(255, 255, 255, 0.1);
            --text: #fff; --text-dim: rgba(255, 255, 255, 0.72);
            --accent: #5b8def; --danger: #ff5252; --ok: #69f0ae;
            --dur-fast: 120ms; --dur-base: 200ms;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            background-image: radial-gradient(700px 400px at 80% 0%, rgba(91, 141, 239, 0.12), transparent 70%);
            color: var(--text); font-family: 'Manrope', -apple-system, sans-serif;
            padding: 20px; max-width: 800px; margin: 0 auto; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        h1 { border-bottom: 1px solid var(--border); padding-bottom: 12px; font-weight: 800; letter-spacing: 0.5px; }
        h2, h3 { font-weight: 700; }
        button {
            background: var(--accent); color: #fff; border: 0; padding: 9px 14px; cursor: pointer;
            border-radius: 8px; margin: 2px; font-family: inherit; font-weight: 600; font-size: 13px;
            box-shadow: 0 3px 12px rgba(91, 141, 239, 0.35);
            transition: background-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out), opacity var(--dur-base) var(--ease-out);
        }
        button:hover { background: #6c99f2; box-shadow: 0 5px 18px rgba(91, 141, 239, 0.5); }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.6; cursor: wait; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .del { background: var(--danger); box-shadow: 0 3px 12px rgba(255, 82, 82, 0.3); }
        .del:hover { background: #ff6e6e; box-shadow: 0 5px 18px rgba(255, 82, 82, 0.45); }
        ul { list-style: none; padding: 0; }
        li {
            background: var(--card); border: 1px solid var(--border); padding: 15px; margin-bottom: 10px;
            border-radius: 12px; font-family: 'JetBrains Mono', monospace;
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            animation: row-in var(--dur-base) var(--ease-out) backwards;
            transition: border-color var(--dur-base) var(--ease-out);
        }
        li:hover { border-color: rgba(255, 255, 255, 0.2); }
        li.active-pass { border-left-color: var(--danger); }
        @keyframes row-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .pass-name { font-size: 16px; font-weight: bold; color: var(--text); display: block; margin-bottom: 8px; }
        .device-info { font-size: 14px; color: var(--text-dim); }
        .device-info b { color: var(--text); }
        .status-free { color: var(--ok); }
        .status-busy { color: var(--danger); font-weight: bold; }
        .ip-list { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
        .err { color: var(--danger); font-family: inherit; background: rgba(255, 82, 82, 0.08); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; }
        .summary { background: var(--card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; color: #7ab4ff; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <h1>Админ-панель</h1>

    <!-- АВТОРИЗАЦИЯ ОТКЛЮЧЕНА — дашборд виден всем -->
    <div id="dashboard">
        <div class="summary" id="summary">Загрузка статистики...</div>
        <button id="gen">➕ Сгенерировать новый пароль</button>
        <div id="list" style="margin-top: 20px;"></div>
    </div>

    <!-- Блок логина скрыт навсегда -->
    <div id="login-box" style="display: none;">
        <h3>🔒 Вход для администратора</h3>
        <input type="password" id="master-pass" placeholder="Введите мастер-пароль">
        <button id="login-btn" style="width: 100%;">Войти</button>
        <div class="err" id="login-err" style="margin-top: 10px; background: transparent;"></div>
    </div>

    <script>
        // АВТОРИЗАЦИЯ ОТКЛЮЧЕНА — сразу показываем админку
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('login-box').style.display = 'none';
        load();

        async function load() {
            try {
                const res = await fetch('/api/admin');
                if (!res.ok) {
                    document.getElementById('list').innerHTML = `<div class="err">Ошибка загрузки: ${res.status}</div>`;
                    return;
                }
                const data = await res.json();
                
                let totalPasswords = data.passwords.length;
                let totalActiveDevices = 0;
                data.passwords.forEach(p => { totalActiveDevices += p.activeDevices; });
                document.getElementById('summary').innerHTML = `📊 Всего паролей: <b>${totalPasswords}</b> | 👥 Устройств онлайн: <b>${totalActiveDevices}</b>`;

                let html = '<h2>Список паролей:</h2><ul>';
                if (data.passwords.length === 0) html += '<li>Паролей пока нет. Сгенерируйте новый.</li>';
                
                data.passwords.forEach(p => {
                    const isBusy = p.activeDevices > 0;
                    const statusText = isBusy ? `<span class="status-busy">🟥 ИСПОЛЬЗУЕТСЯ</span>` : `<span class="status-free">🟩 СВОБОДЕН</span>`;
                    html += `<li class="${isBusy ? 'active-pass' : ''}">
                        <span class="pass-name">🔑 Пароль: ${p.password}</span>
                        <div class="device-info">Статус: ${statusText}<br>Устройств онлайн: <b>${p.activeDevices}</b> из <b>1</b></div>
                        <div class="ip-list">IP: ${p.ips || '— нет подключений —'}</div>
                        <button class="del" style="margin-top:10px;" onclick="del('${p.password}')">🗑 Удалить пароль</button>
                    </li>`;
                });
                html += '</ul><h2>Логи (последние 20):</h2><ul>';
                if (data.logs.length === 0) html += '<li>Логов нет.</li>';
                data.logs.forEach(l => html += `<li style="padding: 8px; font-size: 12px;">${l}</li>`);
                html += '</ul>';
                
                document.getElementById('list').innerHTML = html;
            } catch (e) {
                document.getElementById('list').innerHTML = `<div class="err">Сбой сети: ${e.message}</div>`;
            }
        }

        document.getElementById('gen').onclick = async () => {
            const btn = document.getElementById('gen');
            btn.textContent = 'Генерация...';
            btn.disabled = true;
            try {
                await fetch('/api/admin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'generate' }) });
                load();
            } finally {
                btn.textContent = '➕ Сгенерировать новый пароль';
                btn.disabled = false;
            }
        };

        async function del(pass) {
            if (confirm('Удалить этот пароль?')) {
                await fetch('/api/admin', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ action: 'delete', password: pass }) });
                load();
            }
        }

        // Обновляем каждые 5 секунд
        setInterval(load, 5000);
    </script>
</body>
</html>
